<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login — Audio Converter</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-body">
  <div class="auth-card center">
    <h1>Audio → Roblox Converter</h1>
    <p class="muted">Masuk pakai akun Discord kamu buat mulai convert & upload ke Roblox.</p>

    <a href="/api/auth/discord" class="discord-btn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.317 4.37a19.79 19.79 0 0 0-4.885-1.515.07.07 0 0 0-.075.035c-.21.375-.444.864-.608 1.25a18.27 18.27 0 0 0-5.487 0 12.64 12.64 0 0 0-.617-1.25.07.07 0 0 0-.075-.035A19.736 19.736 0 0 0 3.68 4.37a.064.064 0 0 0-.03.027C.533 9.046-.32 13.58.099 18.057a.08.08 0 0 0 .031.055 19.9 19.9 0 0 0 5.993 3.03.078.078 0 0 0 .084-.028 14.09 14.09 0 0 0 1.226-1.994.076.076 0 0 0-.041-.106 13.107 13.107 0 0 1-1.872-.892.077.077 0 0 1-.008-.128 10.2 10.2 0 0 0 .372-.292.074.074 0 0 1 .077-.01c3.928 1.793 8.18 1.793 12.062 0a.074.074 0 0 1 .078.01c.12.098.246.198.373.292a.077.077 0 0 1-.006.127 12.3 12.3 0 0 1-1.873.892.076.076 0 0 0-.041.107c.36.698.772 1.362 1.225 1.993a.076.076 0 0 0 .084.028 19.84 19.84 0 0 0 6.002-3.03.077.077 0 0 0 .032-.054c.5-5.177-.838-9.673-3.549-13.66a.061.061 0 0 0-.031-.028zM8.02 15.33c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.21 0 2.176 1.094 2.157 2.418 0 1.334-.955 2.419-2.157 2.419zm7.975 0c-1.183 0-2.157-1.085-2.157-2.419 0-1.333.955-2.418 2.157-2.418 1.21 0 2.176 1.094 2.157 2.418 0 1.334-.946 2.419-2.157 2.419z"/></svg>
      Login with Discord
    </a>

    <p id="msg" class="auth-msg"></p>
  </div>

<script>
const params = new URLSearchParams(window.location.search);
const error = params.get("error");
if (error) {
  const messages = {
    state_mismatch: "Sesi login kadaluarsa, coba lagi.",
    banned: "Akun kamu di-suspend. Hubungi admin.",
    access_denied: "Kamu membatalkan login Discord.",
  };
  const el = document.getElementById("msg");
  el.textContent = messages[error] || `Login gagal: ${error}`;
  el.className = "auth-msg err";
}
</script>
</body>
</html>
