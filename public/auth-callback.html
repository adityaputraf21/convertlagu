<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Masuk...</title>
<link rel="stylesheet" href="style.css" />
<link rel="stylesheet" href="auth.css" />
</head>
<body class="auth-body">
  <div class="auth-card center">
    <h1>Menyelesaikan login...</h1>
    <p class="muted" id="msg">Tunggu sebentar</p>
  </div>

<script src="auth-common.js"></script>
<script>
  const hash = window.location.hash.slice(1); // remove leading #
  const params = new URLSearchParams(hash);
  const token = params.get("token");

  if (!token) {
    document.getElementById("msg").textContent = "Login gagal, coba lagi.";
    setTimeout(() => (window.location.href = "login.html"), 1500);
  } else {
    localStorage.setItem("authToken", token);
    // clean the sensitive token out of the URL before redirecting
    window.history.replaceState(null, "", window.location.pathname);
    window.location.href = "index.html";
  }
</script>
</body>
</html>
